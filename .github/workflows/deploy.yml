name: Build & Deploy

# `dev` ga push -> DEV server (46.8.176.92):
#   1) build:  lint -> `docker build` (Next.js standalone, build Dockerfile ichida) ->
#              image GHCR'ga (:<commit-sha> + :dev).
#   2) deploy: /opt/uypilus-front/.env (faqat APP_IMAGE) QAYTA YOZILADI -> docker-compose.yml
#              ko'chiriladi -> `pull + up -d --wait web`. Tashqariga nginx `/` -> 127.0.0.1:13022.
# Serverda build YO'Q. Backend (/opt/uypilus) stack'iga tegilmaydi.
#
# NEXT_PUBLIC_* build vaqtida bundle'ga yoziladi: qiymat o'zgarsa workflow'ni qayta ishga tushiring.
# PROD (keyinchalik, ALOHIDA server): `main` branch + `production` environment —
# o'z SERVER_HOST/secrets'i bilan. Ungacha `main` ga push hech qayerga deploy qilmaydi.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Bir branch'ning ikki deploy'i bir vaqtda serverga tushmasin — keyingisi kutadi.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uypilus-front
  DEPLOY_DIR: /opt/uypilus-front

jobs:
  # Server sirlari bu job'ga UMUMAN berilmaydi: npm paketlari kodi shu yerda ishlaydi.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ghcr.io ga push uchun
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Type-check + `next build` image ichida (Dockerfile: builder stage).
      # NEXT_PUBLIC_API_URL — ixtiyoriy, REPOSITORY variable (build job'da environment yo'q).
      # Bo'sh bo'lsa API so'rovlari front domenining o'ziga ketadi (nginx /dashboard/ -> backend).
      # `image.source` labeli — serverda faqat shu loyiha image'larini tozalash uchun.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hozircha faqat `dev` -> DEV server. Qo'lda (Run workflow) boshqa branch tanlansa — build
  # bo'ladi, deploy o'tkazib yuboriladi: dev serverga boshqa branch kodi tushmasin.
  deploy:
    needs: build
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read           # serverda GITHUB_TOKEN bilan image pull qilish uchun
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ro'yxat to'liq bo'lmasa serverga TEGILMAYDI. Nomlar: README.md (Deploy).
      - name: Deploy to server (.env -> compose pull + up --wait)
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER || secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS || secrets.SERVER_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- /opt/uypilus-front/.env ----
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          ENV_KEYS=(APP_IMAGE)

          # 1. Konfiguratsiya to'liqmi — serverga tegishdan OLDIN
          missing=()
          for key in SERVER_HOST SERVER_USER SERVER_SSH_KEY "${ENV_KEYS[@]}"; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Actions secrets/variables'da yo'q yoki bo'sh: ${missing[*]}"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s' "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          # Server host kaliti: SERVER_KNOWN_HOSTS berilsa qat'iy tekshiriladi (MITM'dan himoya —
          # serverga GHCR tokeni yuboriladi). Berilmasa tekshiruvsiz ulanadi, ogohlantirish bilan.
          if [[ -n "${SERVER_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOST_KEY_CHECK=yes
          else
            echo "::warning::SERVER_KNOWN_HOSTS yo'q — server host kaliti tekshirilmayapti (README.md: Deploy)."
            HOST_KEY_CHECK=no
          fi
          # BatchMode=yes — kalit o'tmasa parolga O'TMAYDI (aks holda ssh "parol"ni stdin'dan,
          # ya'ni .env oqimidan o'qishga urinadi).
          SSH_OPTS=(-i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=$HOST_KEY_CHECK -o ConnectTimeout=20 -o ServerAliveInterval=30)
          TARGET="$SERVER_USER@$SERVER_HOST"

          if ! ssh "${SSH_OPTS[@]}" "$TARGET" true; then
            echo "::error::Serverga SSH kalit bilan kirib bo'lmadi. Tekshiring: SERVER_SSH_KEY ning ochiq kaliti serverda ~/.ssh/authorized_keys da bormi (ssh-copy-id), SERVER_HOST/SERVER_USER to'g'rimi, SERVER_KNOWN_HOSTS (bo'lsa) shu serverniki mi."
            exit 1
          fi

          # 2. Papka — birinchi deploy'da yaratiladi
          if ! ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p '$DEPLOY_DIR'"; then
            echo "::error::$DEPLOY_DIR yaratib bo'lmadi. $SERVER_USER root bo'lmasa, serverda bir marta: sudo install -d -o $SERVER_USER $DEPLOY_DIR"
            exit 1
          fi

          # 3. .env — stdin orqali (buyruq qatoriga va logga tushmaydi), chmod 600, atomik.
          {
            echo "# GitHub Actions yozadi: $GITHUB_REPOSITORY@$GITHUB_REF_NAME (${GITHUB_SHA::7}), $(date -u +%FT%TZ)"
            echo "# Serverda tahrirlamang - har deploy'da qayta yoziladi."
            for key in "${ENV_KEYS[@]}"; do
              printf "%s='%s'\n" "$key" "${!key}"
            done
          } | ssh "${SSH_OPTS[@]}" "$TARGET" \
            "umask 077 && cat > '$DEPLOY_DIR/.env.tmp' && mv -f '$DEPLOY_DIR/.env.tmp' '$DEPLOY_DIR/.env'"

          # 4. Compose fayli — repo'dagisi
          scp "${SSH_OPTS[@]}" docker-compose.yml "$TARGET:$DEPLOY_DIR/docker-compose.yml"

          # 5. GHCR login (token stdin orqali) -> pull -> up --wait -> tozalash -> logout
          # shellcheck disable=SC2029  # GHCR_USER runner'da ochilishi ataylab
          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$TARGET" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh "${SSH_OPTS[@]}" "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ${{ env.DEPLOY_DIR }}
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose pull web
          if ! docker compose up -d --wait --wait-timeout 120 web; then
            docker compose ps
            docker compose logs --tail=100 web
            exit 1
          fi
          docker compose ps
          # Faqat SHU repo'ning ishlatilmayotgan, 3 kundan eski image'lari (yaqinlari rollback uchun qoladi).
          # Boshqa loyihalarning (backend ham) image'lariga tegilmaydi.
          docker image prune -af --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" --filter "until=72h"
          REMOTE
